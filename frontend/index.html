<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowFlow · 问答社区</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <header class="zh-header">
      <div class="logo-block">
        <div class="logo-mark">知</div>
        <div>
          <h1>KnowFlow</h1>
          <p>问答 · 观点 · 关注流</p>
        </div>
      </div>
      <div class="header-actions">
        <input id="feed-search-input" placeholder="搜索问题、文章、作者" />
        <input id="api-base-input" placeholder="API Base" />
        <button id="api-base-save" class="ghost">保存 API</button>
        <button id="logout-btn" class="ghost">退出</button>
      </div>
    </header>

    <div class="notice-wrap">
      <div id="notice" class="notice"></div>
    </div>

    <div class="zh-layout">
      <aside class="left-col">
        <section class="card">
          <h3>账号</h3>
          <div id="auth-panel"></div>
        </section>

        <section class="card">
          <h3>写文章</h3>
          <form id="publish-form" class="stack-form">
            <input name="title" placeholder="文章标题" required maxlength="80" />
            <textarea name="content" placeholder="分享你的观点..." required maxlength="5000"></textarea>
            <button type="submit">发布文章</button>
          </form>
        </section>

        <section class="card">
          <h3>提问题</h3>
          <form id="ask-form" class="stack-form">
            <input name="title" placeholder="问题标题" required maxlength="100" />
            <textarea name="description" placeholder="补充问题背景，帮助回答者理解" required maxlength="5000"></textarea>
            <button type="submit">发布问题</button>
          </form>
        </section>
      </aside>

      <main class="center-col">
        <section class="card stream-head">
          <div id="stream-nav" class="stream-nav"></div>
          <button id="stream-refresh-btn" class="ghost">刷新</button>
        </section>

        <section id="feed-list" class="card feed-list"></section>
        <button id="feed-load-more-btn" class="load-more">加载更多</button>

        <section id="detail-panel" class="card detail-panel"></section>
      </main>

      <aside class="right-col">
        <section class="card">
          <h3>发现用户</h3>
          <div id="discover-list"></div>
        </section>

        <section class="card">
          <h3>互关私信</h3>
          <div id="mutual-list" class="mutual-list"></div>
          <div id="chat-panel" class="chat-panel"></div>
          <form id="chat-form" class="stack-form inline-form">
            <input name="content" placeholder="输入消息" maxlength="280" required />
            <button type="submit">发送</button>
          </form>
        </section>
      </aside>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
