services:
  mysql:
    image: mysql:8.4
    container_name: weblab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: weblab
      MYSQL_USER: weblab
      MYSQL_PASSWORD: weblab123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weblab-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      JWT_SECRET: "change-this-in-production"
      MYSQL_HOST: weblab-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: weblab
      MYSQL_PASSWORD: weblab123456
      MYSQL_DATABASE: weblab
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weblab-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
